[package]
name = "gemini-axi"
version = "0.1.0"
edition = "2024"
authors = ["Joao Gabriel Furlan <jgfurlan@users.noreply.github.com>"]
description = "Headless CDP bridge for the Gemini Web App"
license = "MIT"

[lib]
name = "gemini_axi"
path = "src/lib.rs"

[[bin]]
name = "gemini-axi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["connect"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.16"
